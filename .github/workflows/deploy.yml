name: Build and deploy MyST + JupyterLite

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:
    inputs:
      content_sha:
        description: Commit SHA from CROSSROADS-DS/public-modules
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # public-hub is a GitHub Pages project site:
  # https://crossroads-ds.github.io/public-hub/
  BASE_URL: /${{ github.event.repository.name }}

  # JupyterLite is published inside the MyST site.
  JUPYTERLITE_BASE_URL: /${{ github.event.repository.name }}/jupyterlite/

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out public-hub
        uses: actions/checkout@v6

      - name: Check out public-modules
        uses: actions/checkout@v6
        with:
          repository: CROSSROADS-DS/public-modules

          # When public-modules triggers this workflow, use the exact
          # content commit supplied in content_sha.
          #
          # For pushes, pull requests, and manual runs without a SHA,
          # use the main branch of public-modules.
          ref: ${{ inputs.content_sha || 'main' }}

          # Creates public-hub/public-modules on the workflow runner.
          path: public-modules

          # public-modules is public, so no PAT is required for checkout.
          persist-credentials: false

      - name: Verify public-modules checkout
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "public-modules" ]]; then
            echo "::error title=Missing content repository::The public-modules repository was not downloaded."
            exit 1
          fi

          CONTENT_REVISION="$(git -C public-modules rev-parse HEAD)"

          echo "Using public-modules revision:"
          echo "$CONTENT_REVISION"

          echo "Top-level content:"
          find public-modules \
            -mindepth 1 \
            -maxdepth 1 \
            -printf '%f\n' \
            | sort

          MODULE_COUNT="$(
            find public-modules \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              ! -name ".git" \
              ! -name ".github" \
              | wc -l
          )"

          if [[ "$MODULE_COUNT" -eq 0 ]]; then
            echo "::error title=No modules found::The public-modules repository does not contain any top-level module folders."
            exit 1
          fi

          echo "Found $MODULE_COUNT module folder(s)."

          # Keep the learning content, but do not expose the content
          # repository's Git metadata or GitHub workflow files.
          rm -rf public-modules/.git
          rm -rf public-modules/.github

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install MyST dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund

      - name: Install JupyterLite dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build MyST and JupyterLite
        shell: bash
        run: |
          set -euo pipefail
          npm run build

      - name: Verify generated site
        shell: bash
        run: |
          set -euo pipefail

          test -f "_build/html/index.html"
          test -f "_build/html/jupyterlite/lab/index.html"
          test -f "_build/html/jupyterlite/api/contents/all.json"

          echo "MyST and JupyterLite outputs were generated successfully."

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _build/html
          include-hidden-files: true

  deploy:
    name: Deploy site
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4